name: 🌿 Nature Telegram Post (GigaChat)

on:
  schedule:
    - cron: "0 9,18 * * *"
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Важно для корректной работы auto-commit

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: 📦 Install dependencies
        run: pip install -r requirements.txt

      - name: 📤 Generate & send post
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          GIGACHAT_CREDENTIALS: ${{ secrets.GIGACHAT_CREDENTIALS }}
        run: python post_to_telegram.py

      - name: 💾 Commit updated state
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🔄 Update used topics state [skip ci]"
          file_pattern: used_topics.json
